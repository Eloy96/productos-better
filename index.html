<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario Drive</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Escáner QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .scan-region-highlight { border-radius: 20px; border: 4px solid #4ade80; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.7); pointer-events: none; }
        #reader video { object-fit: cover; border-radius: 12px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-green-700 text-white p-4 shadow-lg flex justify-between items-center shrink-0 z-20">
        <div>
            <h1 class="text-lg font-bold flex items-center gap-2">
                <i data-lucide="cloud-upload"></i> Inventario Drive
            </h1>
            <p class="text-[10px] text-green-200 opacity-90">Conectado a Google Sheets</p>
        </div>
        <button onclick="app.toggleConfig()" class="p-2 hover:bg-green-800 rounded-full transition">
            <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
    </header>

    <!-- Main Content Area -->
    <main id="app-container" class="flex-1 overflow-y-auto relative p-4 pb-24">
        
        <!-- VISTA: Lista de Productos (Principal) -->
        <div id="view-list" class="fade-in space-y-4">
            <div id="empty-state" class="hidden text-center py-12 text-gray-400">
                <i data-lucide="file-spreadsheet" class="w-16 h-16 mx-auto mb-4 opacity-30"></i>
                <p class="text-lg font-medium">Listo para capturar</p>
                <p class="text-xs mt-2">Los datos se enviarán a tu hoja automáticamente.</p>
            </div>
            
            <div id="products-list" class="space-y-3">
                <!-- Los items se inyectan aquí con JS -->
            </div>
        </div>

        <!-- VISTA: Formulario -->
        <div id="view-form" class="hidden fade-in bg-white rounded-xl shadow-xl p-5 mb-10">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-lg font-bold text-gray-800">Nuevo Producto</h2>
                <button onclick="app.showView('list')" class="text-gray-400 hover:text-gray-600"><i data-lucide="x"></i></button>
            </div>

            <form id="inventory-form" onsubmit="app.handleSubmit(event)" class="space-y-4">
                
                <!-- Foto -->
                <div class="flex flex-col items-center justify-center">
                    <div id="photo-preview-container" class="hidden relative w-full">
                        <img id="photo-preview" src="" class="w-full h-48 object-cover rounded-lg shadow-md border border-gray-200">
                        <button type="button" onclick="app.clearPhoto()" class="absolute top-2 right-2 bg-red-600 text-white rounded-full p-2 shadow-lg hover:bg-red-700 transition">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                        <div class="absolute bottom-2 left-2 bg-black/70 text-white text-[10px] px-2 py-1 rounded backdrop-blur">
                            Se guardará en Drive
                        </div>
                    </div>
                    
                    <button id="btn-take-photo" type="button" onclick="app.startCamera('photo')" class="w-full h-32 border-2 border-dashed border-gray-300 rounded-lg flex flex-col items-center justify-center text-gray-400 hover:border-green-500 hover:text-green-500 bg-gray-50 transition-colors">
                        <i data-lucide="camera" class="w-8 h-8 mb-2"></i>
                        <span class="text-sm font-bold">TOMAR FOTO</span>
                    </button>
                </div>

                <!-- SKU -->
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">SKU / Código</label>
                    <div class="flex gap-2">
                        <input type="text" id="inp-sku" required placeholder="Escanear o escribir..." 
                               class="flex-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none font-mono text-sm shadow-sm transition">
                        <button type="button" onclick="app.startCamera('scanner')" class="bg-blue-600 text-white px-4 rounded-lg hover:bg-blue-700 shadow-md transition active:scale-95">
                            <i data-lucide="scan-barcode"></i>
                        </button>
                    </div>
                </div>

                <!-- Nombre -->
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">Nombre del Producto</label>
                    <input type="text" id="inp-name" required placeholder="Ej. Lámpara LED" 
                           class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none shadow-sm text-sm">
                </div>

                <!-- Stock y Precio -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Stock</label>
                        <input type="number" id="inp-stock" min="1" value="1" 
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-center font-bold shadow-sm">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Precio ($)</label>
                        <input type="number" id="inp-price" required step="0.01" placeholder="0.00" 
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-center shadow-sm">
                    </div>
                </div>

                <!-- Botones Acción -->
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="app.showView('list')" class="flex-1 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300 transition">Cancelar</button>
                    <button type="submit" id="btn-submit" class="flex-1 py-3 bg-green-600 text-white rounded-lg font-bold shadow-md hover:bg-green-700 flex justify-center items-center gap-2 transition active:scale-95">
                        <span id="btn-text">Guardar</span>
                        <i data-lucide="cloud-upload" class="w-4 h-4"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- VISTA: Configuración -->
        <div id="view-config" class="hidden fade-in bg-gray-800 text-white p-6 rounded-xl shadow-2xl">
            <div class="text-center mb-6">
                <i data-lucide="settings" class="w-12 h-12 mx-auto text-green-400 mb-2"></i>
                <h2 class="text-xl font-bold">Configuración</h2>
                <p class="text-sm text-gray-400">Enlace a Google Apps Script</p>
            </div>
            <input id="inp-script-url" class="w-full p-3 bg-gray-700 border border-gray-600 rounded mb-4 text-xs text-green-300 font-mono break-all focus:outline-none focus:border-green-500" value="https://script.google.com/macros/s/AKfycbwczNs-lS1aUyJxpvSMuYGekx9zSHxNwWONxw3PdkLhTIbG3D6LqE7SLx4mgl-SwGV5/exec">
            <button onclick="app.saveConfig()" class="w-full bg-green-600 py-3 rounded font-bold hover:bg-green-700 shadow-lg">Guardar y Salir</button>
        </div>

    </main>

    <!-- Floating Action Button -->
    <button id="fab-add" onclick="app.resetForm(); app.showView('form')" class="fixed bottom-6 right-6 bg-green-600 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center z-30 hover:bg-green-700 transition transform hover:scale-110 active:scale-95">
        <i data-lucide="plus" class="w-8 h-8"></i>
    </button>

    <!-- Camera Overlay Modal -->
    <div id="camera-modal" class="fixed inset-0 bg-black z-50 hidden flex flex-col">
        <div class="relative flex-1 flex flex-col justify-center items-center overflow-hidden bg-black">
            
            <!-- Video Element -->
            <video id="camera-video" autoplay playsinline muted class="absolute w-full h-full object-cover"></video>
            
            <!-- Scanner Element -->
            <div id="reader" class="w-full h-full hidden"></div>
            
            <!-- Controls -->
            <button onclick="app.stopCamera()" class="absolute top-4 right-4 bg-black/40 text-white p-3 rounded-full backdrop-blur z-50">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            
            <!-- Scanner Overlay Text -->
            <div id="scanner-overlay" class="hidden absolute bottom-20 bg-black/60 px-4 py-2 rounded-full text-white text-sm backdrop-blur">
                Apunta al código de barras
            </div>
        </div>
        
        <!-- Shutter Button (Photo Mode Only) -->
        <div id="shutter-container" class="h-24 bg-black flex items-center justify-center shrink-0">
            <button onclick="app.capturePhoto()" class="w-16 h-16 bg-white rounded-full border-4 border-gray-400 hover:border-gray-200 transition transform active:scale-95"></button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="notification" class="fixed top-20 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl z-50 text-white font-medium text-sm hidden transition-all duration-300">
        Mensaje
    </div>

    <!-- Canvas oculto para procesar foto -->
    <canvas id="photo-canvas" class="hidden"></canvas>

    <!-- JavaScript Logic -->
    <script>
        const app = {
            data: {
                scriptUrl: localStorage.getItem('GOOGLE_SCRIPT_URL') || "https://script.google.com/macros/s/AKfycbwczNs-lS1aUyJxpvSMuYGekx9zSHxNwWONxw3PdkLhTIbG3D6LqE7SLx4mgl-SwGV5/exec",
                currentImageBase64: null,
                stream: null,
                products: []
            },
            
            init() {
                lucide.createIcons();
                this.renderList();
                
                // Si no hay URL configurada, mostrar config
                if(!this.data.scriptUrl) {
                   this.showView('config');
                }
            },

            // --- Navigation ---
            showView(viewName) {
                // Hide all
                document.getElementById('view-list').classList.add('hidden');
                document.getElementById('view-form').classList.add('hidden');
                document.getElementById('view-config').classList.add('hidden');
                document.getElementById('fab-add').classList.add('hidden');
                
                // Show requested
                document.getElementById(`view-${viewName}`).classList.remove('hidden');
                
                // FAB Logic
                if(viewName === 'list') {
                    document.getElementById('fab-add').classList.remove('hidden');
                    this.renderList();
                }
            },

            toggleConfig() {
                const configView = document.getElementById('view-config');
                if(configView.classList.contains('hidden')) {
                    this.showView('config');
                } else {
                    this.showView('list');
                }
            },

            saveConfig() {
                const url = document.getElementById('inp-script-url').value.trim();
                if(!url.startsWith('https://script.google.com/')) {
                    this.notify('URL inválida', 'error');
                    return;
                }
                this.data.scriptUrl = url;
                localStorage.setItem('GOOGLE_SCRIPT_URL', url);
                this.notify('Configuración guardada');
                this.showView('list');
            },

            // --- Form Handling ---
            resetForm() {
                document.getElementById('inventory-form').reset();
                this.data.currentImageBase64 = null;
                this.updatePhotoUI();
            },

            clearPhoto() {
                this.data.currentImageBase64 = null;
                this.updatePhotoUI();
            },

            updatePhotoUI() {
                const previewContainer = document.getElementById('photo-preview-container');
                const btnTakePhoto = document.getElementById('btn-take-photo');
                const previewImg = document.getElementById('photo-preview');

                if (this.data.currentImageBase64) {
                    previewImg.src = this.data.currentImageBase64;
                    previewContainer.classList.remove('hidden');
                    btnTakePhoto.classList.add('hidden');
                } else {
                    previewContainer.classList.add('hidden');
                    btnTakePhoto.classList.remove('hidden');
                }
            },

            async handleSubmit(e) {
                e.preventDefault();
                const btn = document.getElementById('btn-submit');
                const btnText = document.getElementById('btn-text');
                
                // Loading state
                btn.disabled = true;
                btn.classList.add('opacity-70');
                btnText.textContent = 'Enviando...';

                const payload = {
                    name: document.getElementById('inp-name').value,
                    sku: document.getElementById('inp-sku').value,
                    stock: document.getElementById('inp-stock').value,
                    price: document.getElementById('inp-price').value,
                    imageBase64: this.data.currentImageBase64
                };

                try {
                    await fetch(this.data.scriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });

                    // Success handling (Blind due to no-cors)
                    this.data.products.unshift({ ...payload, id: Date.now() });
                    this.notify('¡Datos enviados a Drive!', 'success');
                    this.showView('list');

                } catch (error) {
                    console.error(error);
                    this.notify('Error de conexión', 'error');
                } finally {
                    btn.disabled = false;
                    btn.classList.remove('opacity-70');
                    btnText.textContent = 'Guardar';
                }
            },

            // --- List Rendering ---
            renderList() {
                const listContainer = document.getElementById('products-list');
                const emptyState = document.getElementById('empty-state');
                
                listContainer.innerHTML = '';

                if(this.data.products.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }
                
                emptyState.classList.add('hidden');
                
                // Cabecera "Recientes"
                const header = document.createElement('div');
                header.className = 'text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 mt-4 ml-1';
                header.innerText = 'Enviados Recientemente';
                listContainer.appendChild(header);

                this.data.products.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'bg-white p-3 rounded-lg shadow-sm flex items-center gap-3 border-l-4 border-green-500 animate-[fadeIn_0.3s_ease-out]';
                    item.innerHTML = `
                        <div class="w-12 h-12 bg-gray-200 rounded-md overflow-hidden shrink-0">
                            ${p.imageBase64 
                                ? `<img src="${p.imageBase64}" class="w-full h-full object-cover">` 
                                : '<div class="w-full h-full flex items-center justify-center text-gray-400"><i data-lucide="image"></i></div>'}
                        </div>
                        <div class="min-w-0 flex-1">
                            <h3 class="font-bold text-gray-800 truncate text-sm">${p.name}</h3>
                            <div class="flex items-center gap-2 text-xs text-gray-500">
                                <span class="bg-gray-100 px-1.5 py-0.5 rounded font-mono">${p.sku}</span>
                                <span class="text-green-600 font-bold">$${p.price}</span>
                                <span class="text-blue-600 font-bold">+${p.stock}</span>
                            </div>
                        </div>
                        <div class="text-green-500">
                            <i data-lucide="check-circle" class="w-5 h-5"></i>
                        </div>
                    `;
                    listContainer.appendChild(item);
                });
                lucide.createIcons();
            },

            // --- Camera & Scanner ---
            async startCamera(mode) {
                const modal = document.getElementById('camera-modal');
                const video = document.getElementById('camera-video');
                const scannerOverlay = document.getElementById('scanner-overlay');
                const shutter = document.getElementById('shutter-container');
                const readerDiv = document.getElementById('reader');

                modal.classList.remove('hidden');

                if (mode === 'scanner') {
                    video.classList.add('hidden');
                    readerDiv.classList.remove('hidden');
                    shutter.classList.add('hidden');
                    scannerOverlay.classList.remove('hidden');
                    
                    // Start QR Scanner
                    this.html5QrCode = new Html5Qrcode("reader");
                    const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                    
                    try {
                        await this.html5QrCode.start({ facingMode: "environment" }, config, 
                            (decodedText) => {
                                // Success
                                document.getElementById('inp-sku').value = decodedText;
                                this.notify('Código capturado: ' + decodedText);
                                this.stopCamera();
                            },
                            () => {} // Ignore scan errors
                        );
                    } catch (err) {
                        this.notify('Error al iniciar escáner', 'error');
                        this.stopCamera();
                    }

                } else {
                    // Photo Mode
                    readerDiv.classList.add('hidden');
                    video.classList.remove('hidden');
                    shutter.classList.remove('hidden');
                    scannerOverlay.classList.add('hidden');

                    try {
                        // SOLUCIÓN BORROSO: Pedimos una resolución HD o Full HD explícitamente
                        // 'ideal' intenta obtener esa resolución, si no puede, usa la mejor disponible.
                        const constraints = { 
                            video: { 
                                facingMode: 'environment',
                                width: { ideal: 1920 },
                                height: { ideal: 1080 } 
                            } 
                        };
                        
                        const stream = await navigator.mediaDevices.getUserMedia(constraints);
                        this.data.stream = stream;
                        video.srcObject = stream;
                    } catch (err) {
                        this.notify('No se pudo acceder a la cámara', 'error');
                        this.stopCamera();
                    }
                }
            },

            stopCamera() {
                const modal = document.getElementById('camera-modal');
                modal.classList.add('hidden');
                
                // Stop Video Stream
                if (this.data.stream) {
                    this.data.stream.getTracks().forEach(track => track.stop());
                    this.data.stream = null;
                }
                
                // Stop Scanner
                if (this.html5QrCode) {
                    this.html5QrCode.stop().then(() => {
                        this.html5QrCode.clear();
                        this.html5QrCode = null;
                    }).catch(console.error);
                }
            },

            capturePhoto() {
                const video = document.getElementById('camera-video');
                const canvas = document.getElementById('photo-canvas');
                
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    // Usamos la resolución real del video (que ahora será HD gracias al cambio anterior)
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Compress to 0.9 quality jpeg (Mejor calidad, antes era 0.7)
                    this.data.currentImageBase64 = canvas.toDataURL('image/jpeg', 0.9);
                    
                    this.stopCamera();
                    this.updatePhotoUI();
                }
            },

            // --- Utilities ---
            notify(msg, type = 'success') {
                const notif = document.getElementById('notification');
                notif.textContent = msg;
                notif.className = `fixed top-20 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-xl z-50 text-white font-medium text-sm transition-all duration-300 animate-[bounce_1s] ${type === 'error' ? 'bg-red-600' : 'bg-green-600'}`;
                notif.classList.remove('hidden');
                setTimeout(() => {
                    notif.classList.add('hidden');
                }, 3000);
            }
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
