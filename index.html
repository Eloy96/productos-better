<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario Drive Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Escáner QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #16a34a; width: 24px; height: 24px; -webkit-animation: spin 1s linear infinite; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-green-700 text-white p-4 shadow-lg flex justify-between items-center shrink-0 z-20">
        <div>
            <h1 class="text-lg font-bold flex items-center gap-2">
                <i data-lucide="package-search"></i> Inventario Pro
            </h1>
            <p class="text-[10px] text-green-200 opacity-90">Gestión Total</p>
        </div>
        <button onclick="app.showConfig()" class="p-2 hover:bg-green-800 rounded-full transition">
            <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main id="app-container" class="flex-1 overflow-y-auto p-4 pb-24 relative">
        
        <!-- PANTALLA 1: BÚSQUEDA Y LISTA (Inicio) -->
        <div id="view-search" class="fade-in max-w-md mx-auto mt-2">
            
            <!-- Buscador -->
            <div class="bg-white rounded-xl shadow-md p-5 mb-6">
                <div class="flex gap-2 mb-3">
                    <input type="text" id="search-sku" placeholder="Escanear o Escribir SKU..." 
                           class="flex-1 p-3 border-2 border-gray-200 rounded-lg focus:border-green-500 focus:outline-none text-lg font-mono text-center uppercase">
                    <button onclick="app.startCamera('scanner')" class="bg-gray-800 text-white px-4 rounded-lg hover:bg-black transition">
                        <i data-lucide="camera" class="w-6 h-6"></i>
                    </button>
                </div>
                <button onclick="app.checkSku()" id="btn-search" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow hover:bg-green-700 transition flex justify-center items-center gap-2">
                    <span>Buscar / Registrar</span>
                    <i data-lucide="search" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Lista Global -->
            <div id="global-inventory-container">
                <div class="flex justify-between items-center mb-3 ml-1">
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="globe" class="w-3 h-3"></i> Inventario en la Nube
                    </h3>
                    <button onclick="app.loadGlobalInventory()" class="text-blue-500 hover:text-blue-700 p-1 rounded-full hover:bg-blue-50 transition">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    </button>
                </div>
                
                <!-- Loading State -->
                <div id="inventory-loader" class="text-center py-8 hidden">
                    <div class="loader mx-auto mb-2"></div>
                    <p class="text-xs text-gray-400">Cargando productos...</p>
                </div>

                <!-- Lista -->
                <div id="inventory-list" class="space-y-3 pb-6">
                    <!-- Items inyectados por JS -->
                </div>
            </div>
        </div>

        <!-- PANTALLA 2: PRODUCTO EXISTENTE -->
        <div id="view-existing" class="hidden slide-up max-w-md mx-auto mt-4">
            <div class="bg-white rounded-xl shadow-lg overflow-hidden border-t-4 border-blue-500">
                <div class="bg-blue-50 p-3 border-b border-blue-100 flex items-center justify-between px-4">
                    <div class="flex items-center gap-2">
                        <i data-lucide="check-circle" class="text-blue-600 w-5 h-5"></i>
                        <span class="font-bold text-blue-900 text-sm">Registrado</span>
                    </div>
                    <!-- Botones de Gestión -->
                    <div class="flex gap-2">
                        <button onclick="app.editProduct()" class="p-1.5 bg-yellow-100 text-yellow-700 rounded hover:bg-yellow-200" title="Editar">
                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                        </button>
                        <button onclick="app.deleteProduct()" class="p-1.5 bg-red-100 text-red-700 rounded hover:bg-red-200" title="Eliminar">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                
                <div class="p-6 text-center">
                    <div class="mb-6 flex flex-col items-center">
                        <div class="w-64 h-64 bg-gray-200 rounded-lg overflow-hidden shadow-sm mb-3 relative group">
                            <!-- Imagen remota con fix -->
                            <img id="exist-img" src="" class="w-full h-full object-cover hidden transition-opacity duration-300">
                            
                            <!-- Fallback -->
                            <div id="exist-fallback" class="w-full h-full flex flex-col items-center justify-center text-gray-400 absolute inset-0 bg-gray-100">
                                <i data-lucide="image" class="w-16 h-16 mb-2 opacity-50"></i>
                                <span class="text-xs">Sin imagen</span>
                            </div>
                        </div>
                        <h3 id="exist-name" class="font-bold text-gray-800 text-xl leading-tight mb-1">Nombre Producto</h3>
                        <p class="text-gray-500 text-sm mb-2 font-mono" id="exist-sku-display">SKU: ---</p>
                        
                        <div class="flex gap-4 text-sm bg-gray-50 px-4 py-2 rounded-full border">
                            <span>Precio: <strong id="exist-price" class="text-gray-800">$0.00</strong></span>
                            <span class="text-gray-300">|</span>
                            <span>Stock: <strong id="exist-stock-current" class="text-blue-600">0</strong></span>
                        </div>
                    </div>

                    <p class="text-gray-800 font-bold mb-4 text-lg">Acciones Rápidas</p>

                    <div class="grid grid-cols-1 gap-3">
                        <button onclick="app.quickAddOne()" id="btn-add-one" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-blue-700 transition flex items-center justify-center gap-2 active:scale-95">
                            <i data-lucide="plus-circle" class="w-6 h-6"></i> Agregar +1
                        </button>
                        <button onclick="app.resetToSearch()" class="w-full bg-white border-2 border-gray-200 text-gray-600 py-3 rounded-xl font-bold hover:bg-gray-100 transition flex items-center justify-center gap-2">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i> Volver
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANTALLA 3: PRODUCTO NUEVO / EDITAR -->
        <div id="view-new" class="hidden slide-up max-w-md mx-auto mt-4">
            <div class="bg-white rounded-xl shadow-lg border-t-4 border-green-500 p-5">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 id="form-title" class="font-bold text-green-900 text-lg">Nuevo Producto</h2>
                        <p class="text-xs text-green-700">SKU <span id="new-sku-display" class="font-mono font-bold bg-green-100 px-1 rounded">---</span></p>
                    </div>
                    <button onclick="app.resetToSearch()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x"></i></button>
                </div>

                <div class="space-y-4">
                    <div class="flex flex-col items-center justify-center">
                        <div id="new-photo-preview-container" class="hidden relative w-full group">
                            <img id="new-photo-preview" src="" class="w-full h-64 object-cover rounded-lg shadow-sm border">
                            <button onclick="app.clearPhoto()" class="absolute top-2 right-2 bg-red-600 text-white rounded-full p-2 shadow-lg"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                        </div>
                        <button id="btn-take-photo" onclick="app.startCamera('photo')" class="w-full h-40 border-2 border-dashed border-gray-300 rounded-lg flex flex-col items-center justify-center text-gray-400 hover:border-green-500 hover:text-green-500 bg-gray-50 transition">
                            <i data-lucide="camera" class="w-10 h-10 mb-2"></i>
                            <span class="text-sm font-bold">TOMAR FOTO HD</span>
                        </button>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-gray-500">Nombre</label>
                        <input id="new-name" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="Ej. Lámpara">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label id="lbl-stock" class="text-xs font-bold text-gray-500">Stock Inicial</label>
                            <input type="number" id="new-stock" value="1" class="w-full p-3 border rounded-lg text-center font-bold focus:ring-2 focus:ring-green-500 outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500">Precio ($)</label>
                            <input type="number" id="new-price" placeholder="0.00" class="w-full p-3 border rounded-lg text-center focus:ring-2 focus:ring-green-500 outline-none">
                        </div>
                    </div>

                    <!-- Modo Edición flag -->
                    <input type="hidden" id="is-edit-mode" value="false">

                    <button onclick="app.submitProductForm()" id="btn-create" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold shadow hover:bg-green-700 transition flex justify-center items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> Guardar
                    </button>
                </div>
            </div>
        </div>

        <!-- PANTALLA: CONFIGURACIÓN -->
        <div id="view-config" class="hidden fade-in bg-gray-800 text-white p-6 rounded-xl shadow-2xl mt-10 max-w-md mx-auto">
            <h2 class="text-xl font-bold mb-4 text-center">Configuración</h2>
            <input id="inp-script-url" class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-xs text-green-300 font-mono mb-4" placeholder="URL Google Script...">
            <div class="flex gap-2">
                <button onclick="app.resetToSearch()" class="flex-1 bg-gray-600 py-2 rounded">Cancelar</button>
                <button onclick="app.saveConfig()" class="flex-1 bg-green-600 py-2 rounded font-bold">Guardar</button>
            </div>
        </div>
    </main>

    <!-- Modal Cámara -->
    <div id="camera-modal" class="fixed inset-0 bg-black z-50 hidden flex flex-col">
        <div class="relative flex-1 bg-black flex flex-col justify-center overflow-hidden">
            <video id="camera-video" autoplay playsinline muted class="absolute w-full h-full object-cover"></video>
            <div id="reader" class="w-full h-full hidden"></div>
            <button onclick="app.stopCamera()" class="absolute top-4 right-4 bg-white/20 text-white p-2 rounded-full backdrop-blur z-50"><i data-lucide="x"></i></button>
        </div>
        <div id="photo-controls" class="h-24 bg-black flex items-center justify-center shrink-0">
            <button onclick="app.capturePhoto()" class="w-16 h-16 bg-white rounded-full border-4 border-gray-400 hover:scale-105 transition"></button>
        </div>
    </div>

    <!-- Notificación -->
    <div id="notification" class="fixed top-10 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl z-50 text-white font-medium text-sm hidden transition-all duration-300 text-center w-max max-w-[90%]">Mensaje</div>
    <canvas id="photo-canvas" class="hidden"></canvas>

    <script>
        const app = {
            state: {
                url: localStorage.getItem('GOOGLE_SCRIPT_URL') || "https://script.google.com/macros/s/AKfycbwczNs-lS1aUyJxpvSMuYGekx9zSHxNwWONxw3PdkLhTIbG3D6LqE7SLx4mgl-SwGV5/exec",
                currentSku: '',
                currentPhoto: null,
                stream: null,
                existingData: null
            },

            init() {
                lucide.createIcons();
                if (!this.state.url) this.showConfig();
                else this.loadGlobalInventory(); 
            },

            // --- AYUDANTE DE IMAGENES (SOLUCIÓN A FOTOS ROTAS) ---
            getEmbedLink(link) {
                if (!link) return null;
                // Si ya es un blob o base64, devolverlo tal cual
                if (link.startsWith('data:') || link.startsWith('blob:')) return link;
                
                // Extraer ID de archivo de Drive
                let id = null;
                const patterns = [
                    /id=([a-zA-Z0-9_-]{25,})/,
                    /\/d\/([a-zA-Z0-9_-]{25,})\//,
                    /open\?id=([a-zA-Z0-9_-]{25,})/
                ];
                
                for (let p of patterns) {
                    const match = link.match(p);
                    if (match && match[1]) {
                        id = match[1];
                        break;
                    }
                }
                
                if (id) {
                    // Usar el link de thumbnail de Google que es mucho más rápido y seguro para <img> tags
                    return `https://drive.google.com/thumbnail?id=${id}&sz=w800`; // sz=w800 pide ancho 800px
                }
                
                return link; // Si no es de drive, devolver original
            },

            async loadGlobalInventory() {
                const listContainer = document.getElementById('inventory-list');
                const loader = document.getElementById('inventory-loader');
                
                if(listContainer.children.length === 0) loader.classList.remove('hidden');

                try {
                    const response = await fetch(`${this.state.url}?action=getAll`, {
                        method: 'GET',
                        redirect: 'follow'
                    });

                    if (!response.ok) throw new Error("Status " + response.status);

                    const json = await response.json();
                    loader.classList.add('hidden');
                    
                    if (json.status === 'success') {
                        this.renderInventoryList(json.data);
                    } else {
                        throw new Error("API devolvió error");
                    }
                } catch (e) {
                    console.warn("Fallo al conectar:", e.message);
                    loader.classList.add('hidden');
                    
                    listContainer.innerHTML = `
                        <div class="text-center p-6 bg-red-50 rounded-lg border border-red-100">
                            <i data-lucide="wifi-off" class="w-8 h-8 text-red-400 mx-auto mb-2"></i>
                            <p class="text-sm text-red-600 font-bold">Sin conexión</p>
                            <button onclick="app.showConfig()" class="text-xs text-red-500 underline mt-2">Revisar URL</button>
                        </div>
                    `;
                    lucide.createIcons();
                }
            },

            renderInventoryList(products) {
                const list = document.getElementById('inventory-list');
                list.innerHTML = ''; 

                if (products.length === 0) {
                    list.innerHTML = '<div class="text-center text-gray-400 text-xs py-4">Inventario vacío</div>';
                    return;
                }

                products.forEach(p => {
                    const div = document.createElement('div');
                    div.className = "bg-white p-3 rounded-lg border border-gray-100 flex gap-3 items-center shadow-sm hover:shadow-md transition active:scale-[0.98]";
                    div.onclick = () => {
                        document.getElementById('search-sku').value = p.sku;
                        this.checkSku();
                    };
                    
                    // Usar helper de imagen
                    const safeImg = this.getEmbedLink(p.image);
                    let imgHtml = `<div class="w-full h-full flex items-center justify-center text-gray-300 bg-gray-100"><i data-lucide="image" class="w-4 h-4"></i></div>`;
                    
                    if (safeImg) {
                         imgHtml = `<img src="${safeImg}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-gray-300 bg-gray-100\\'><i data-lucide=\\'image-off\\' class=\\'w-4 h-4\\'></i></div>'; lucide.createIcons();">`;
                    }

                    div.innerHTML = `
                        <div class="w-12 h-12 rounded-md overflow-hidden shrink-0 border border-gray-200 relative">
                            ${imgHtml}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-gray-800 text-sm truncate">${p.name}</h4>
                            <div class="flex items-center gap-2 text-xs text-gray-500">
                                <span class="bg-gray-100 px-1.5 py-0.5 rounded font-mono text-[10px]">${p.sku}</span>
                                <span class="text-green-600 font-bold">$${p.price}</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="block text-lg font-bold text-blue-600 leading-none">${p.stock}</span>
                            <span class="text-[10px] text-gray-400">stock</span>
                        </div>
                    `;
                    list.appendChild(div);
                });
                lucide.createIcons();
            },

            showView(id) {
                ['view-search', 'view-existing', 'view-new', 'view-config'].forEach(v => document.getElementById(v).classList.add('hidden'));
                document.getElementById(id).classList.remove('hidden');
                lucide.createIcons();
            },

            showConfig() {
                document.getElementById('inp-script-url').value = this.state.url;
                this.showView('view-config');
            },

            saveConfig() {
                const url = document.getElementById('inp-script-url').value.trim();
                if (url.startsWith('https')) {
                    this.state.url = url;
                    localStorage.setItem('GOOGLE_SCRIPT_URL', url);
                    this.notify('Guardado');
                    this.resetToSearch();
                } else {
                    this.notify('URL inválida', 'error');
                }
            },

            resetToSearch() {
                this.state.currentSku = '';
                this.state.currentPhoto = null;
                this.state.existingData = null;
                document.getElementById('search-sku').value = '';
                document.getElementById('new-name').value = '';
                document.getElementById('new-price').value = '';
                document.getElementById('new-stock').value = '1';
                document.getElementById('is-edit-mode').value = 'false';
                this.updatePhotoUI();
                this.showView('view-search');
                this.loadGlobalInventory(); 
            },

            async checkSku() {
                const skuInput = document.getElementById('search-sku');
                const sku = skuInput.value.trim().toUpperCase();
                if (!sku) return this.notify('Ingresa un SKU', 'error');
                
                this.state.currentSku = sku;
                const btn = document.getElementById('btn-search');
                const originalText = btn.innerHTML;
                
                btn.disabled = true;
                btn.innerHTML = '<div class="loader"></div>';

                try {
                    const response = await fetch(`${this.state.url}?sku=${encodeURIComponent(sku)}`, {
                        redirect: 'follow'
                    });
                    
                    if (!response.ok) throw new Error("Error HTTP");
                    const json = await response.json();

                    if (json.exists) {
                        this.state.existingData = json.data; 
                        this.renderExisting(json.data);
                    } else {
                        this.renderNew(); // Modo Nuevo
                    }
                } catch (e) {
                    console.warn(e);
                    this.notify('Error de conexión', 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            },

            renderExisting(data) {
                document.getElementById('exist-name').textContent = data.name;
                document.getElementById('exist-sku-display').textContent = 'SKU: ' + data.sku;
                document.getElementById('exist-price').textContent = '$' + data.price;
                document.getElementById('exist-stock-current').textContent = data.stock;
                
                const img = document.getElementById('exist-img');
                const fallback = document.getElementById('exist-fallback');
                
                // Usar helper de imagen
                const safeImg = this.getEmbedLink(data.image);

                if (safeImg) {
                    img.src = safeImg;
                    img.style.display = 'block';
                    img.classList.remove('hidden');
                    fallback.style.display = 'none';
                } else {
                    img.style.display = 'none';
                    img.classList.add('hidden');
                    fallback.style.display = 'flex';
                }
                this.showView('view-existing');
            },

            // --- MODO NUEVO / EDITAR ---
            renderNew() {
                // Modo registro nuevo normal
                document.getElementById('form-title').innerText = "Nuevo Producto";
                document.getElementById('new-sku-display').textContent = this.state.currentSku;
                document.getElementById('lbl-stock').innerText = "Stock Inicial";
                document.getElementById('is-edit-mode').value = 'false';
                
                // Limpiar campos
                document.getElementById('new-name').value = '';
                document.getElementById('new-price').value = '';
                document.getElementById('new-stock').value = '1';
                this.clearPhoto();
                
                this.showView('view-new');
            },

            editProduct() {
                const data = this.state.existingData;
                if(!data) return;

                // Preparar modo edición
                document.getElementById('form-title').innerText = "Editar Producto";
                document.getElementById('new-sku-display').textContent = data.sku;
                document.getElementById('lbl-stock').innerText = "Stock Total (Sobrescribir)";
                document.getElementById('is-edit-mode').value = 'true';

                // Rellenar datos
                document.getElementById('new-name').value = data.name;
                document.getElementById('new-price').value = data.price;
                document.getElementById('new-stock').value = data.stock;
                
                // Foto actual
                const safeImg = this.getEmbedLink(data.image);
                if(safeImg) {
                   this.state.currentPhoto = safeImg; // Usamos el link como "foto actual"
                   document.getElementById('new-photo-preview').src = safeImg;
                   document.getElementById('new-photo-preview-container').classList.remove('hidden');
                   document.getElementById('btn-take-photo').classList.add('hidden');
                } else {
                   this.clearPhoto();
                }

                this.showView('view-new');
            },

            // --- ELIMINAR ---
            async deleteProduct() {
                const sku = this.state.existingData.sku;
                const name = this.state.existingData.name;
                
                // Doble confirmación (Simple y segura)
                if(confirm(`¿Estás seguro de ELIMINAR "${name}"?\nEsta acción no se puede deshacer.`)) {
                    if(confirm(`CONFIRMACIÓN FINAL:\n¿Borrar definitivamente el producto SKU: ${sku}?`)) {
                        
                        const payload = { action: 'delete', sku: sku };
                        await this.sendData(payload, 'Producto eliminado');
                    }
                }
            },

            async quickAddOne() {
                const payload = {
                    action: 'add', // Acción implícita anterior
                    sku: this.state.currentSku,
                    stock: 1, 
                    price: this.state.existingData.price,
                    name: this.state.existingData.name,
                    imageBase64: null 
                };
                await this.sendData(payload, `Stock +1`, 'btn-add-one');
            },

            async submitProductForm() {
                const name = document.getElementById('new-name').value.trim();
                const price = document.getElementById('new-price').value;
                const stock = document.getElementById('new-stock').value;
                const isEdit = document.getElementById('is-edit-mode').value === 'true';

                if (!name || !price) return this.notify('Faltan datos', 'error');

                // Si estamos editando y la foto es una URL (no base64), no enviamos nada para mantener la anterior
                let imageToSend = this.state.currentPhoto;
                if (imageToSend && !imageToSend.startsWith('data:')) {
                    imageToSend = null; // No enviar URL como base64
                }

                const payload = {
                    action: isEdit ? 'update' : 'create', // Flag para el backend
                    sku: this.state.currentSku,
                    name: name,
                    price: price,
                    stock: stock,
                    imageBase64: imageToSend
                };
                
                await this.sendData(payload, isEdit ? 'Actualizado' : 'Registrado', 'btn-create');
            },

            async sendData(payload, successMessage, btnId) {
                const btn = document.getElementById(btnId);
                const originalHTML = btn ? btn.innerHTML : '';
                if(btn) { btn.disabled = true; btn.innerText = 'Procesando...'; }

                try {
                    // Usar mode: 'no-cors' tiene limitaciones (no lee respuesta), pero es necesario para forms simples a Google Script
                    // Para DELETE y UPDATE complejos, idealmente el script debe devolver JSONP o usar proxy, 
                    // pero con 'no-cors' asumimos éxito si no hay error de red.
                    await fetch(this.state.url, {
                        method: 'POST',
                        mode: 'no-cors', 
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                    
                    this.notify(successMessage, 'success');
                    this.resetToSearch(); 
                } catch (e) {
                    this.notify('Error conexión', 'error');
                } finally {
                    if(btn) { btn.disabled = false; btn.innerHTML = originalHTML; }
                }
            },

            async startCamera(mode) {
                const modal = document.getElementById('camera-modal');
                const video = document.getElementById('camera-video');
                const readerDiv = document.getElementById('reader');
                const controls = document.getElementById('photo-controls');

                modal.classList.remove('hidden');

                if (mode === 'scanner') {
                    video.classList.add('hidden');
                    controls.classList.add('hidden');
                    readerDiv.classList.remove('hidden');
                    this.html5QrCode = new Html5Qrcode("reader");
                    try {
                        await this.html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                            (text) => {
                                document.getElementById('search-sku').value = text;
                                this.notify('Código detectado');
                                this.stopCamera();
                                this.checkSku(); 
                            }, () => {});
                    } catch (e) { this.stopCamera(); }
                } else {
                    readerDiv.classList.add('hidden');
                    video.classList.remove('hidden');
                    controls.classList.remove('hidden');
                    try {
                        const constraints = { video: { facingMode: 'environment', width: { ideal: 4096 }, height: { ideal: 2160 } } };
                        const stream = await navigator.mediaDevices.getUserMedia(constraints);
                        this.state.stream = stream;
                        video.srcObject = stream;
                    } catch (e) { this.stopCamera(); this.notify("Error al abrir cámara", "error"); }
                }
            },

            stopCamera() {
                document.getElementById('camera-modal').classList.add('hidden');
                if (this.state.stream) this.state.stream.getTracks().forEach(t => t.stop());
                if (this.html5QrCode) this.html5QrCode.stop().then(() => this.html5QrCode.clear()).catch(console.error);
            },

            capturePhoto() {
                const video = document.getElementById('camera-video');
                const canvas = document.getElementById('photo-canvas');
                
                if (video.videoWidth > 0 && video.videoHeight > 0) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    this.state.currentPhoto = canvas.toDataURL('image/jpeg', 1.0);
                    this.stopCamera();
                    this.updatePhotoUI();
                } else {
                    this.notify("Cargando cámara...", "error");
                    setTimeout(() => this.capturePhoto(), 500);
                }
            },

            updatePhotoUI() {
                const container = document.getElementById('new-photo-preview-container');
                const btn = document.getElementById('btn-take-photo');
                if (this.state.currentPhoto) {
                    document.getElementById('new-photo-preview').src = this.state.currentPhoto;
                    container.classList.remove('hidden');
                    btn.classList.add('hidden');
                } else {
                    container.classList.add('hidden');
                    btn.classList.remove('hidden');
                }
            },

            clearPhoto() { this.state.currentPhoto = null; this.updatePhotoUI(); },
            
            notify(msg, type = 'success') {
                const el = document.getElementById('notification');
                el.textContent = msg;
                el.className = `fixed top-10 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl z-50 text-white font-medium text-sm transition-all duration-300 text-center ${type === 'error' ? 'bg-red-600' : 'bg-green-600'}`;
                el.classList.remove('hidden');
                setTimeout(() => el.classList.add('hidden'), 3000);
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
